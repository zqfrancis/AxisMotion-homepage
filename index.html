<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#87ceeb">
<title>AxisMotion 世界</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #87ceeb; color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #title {
    position: absolute; top: 14px; left: 16px;
    font-size: 22px; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,.45);
  }
  #title small { display: block; font-size: 12.5px; font-weight: 400; opacity: .9; margin-top: 2px; }
  .hudbtn {
    pointer-events: auto; cursor: pointer; border: 1px solid rgba(255,255,255,.5);
    background: rgba(0,0,0,.35); color: #fff; border-radius: 999px;
    padding: 8px 16px; font-size: 14px; font-weight: 700;
  }
  .hudbtn:active { transform: scale(.94); }
  #btnMenu { position: absolute; top: 14px; right: 16px; }
  #btnLang { position: absolute; top: 56px; right: 16px; }
  #cross {
    position: absolute; left: 50%; top: 50%; width: 8px; height: 8px;
    margin: -4px 0 0 -4px; border-radius: 50%;
    background: rgba(255,255,255,.9); box-shadow: 0 0 6px rgba(0,0,0,.6);
    display: none;
  }
  #prompt {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    display: none; align-items: center; gap: 12px;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35);
    border-radius: 14px; padding: 12px 16px; font-size: 16px; font-weight: 700;
    white-space: nowrap;
  }
  #prompt.show { display: flex; }
  #btnEnter {
    pointer-events: auto; cursor: pointer; border: none; border-radius: 10px;
    background: #ffd32a; color: #222; font-size: 16px; font-weight: 800;
    padding: 8px 18px;
  }
  #btnEnter:active { transform: scale(.94); }
  #hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    font-size: 13px; background: rgba(0,0,0,.35); border-radius: 999px;
    padding: 6px 14px; white-space: nowrap;
  }
  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,16,32,.72); text-align: center; padding: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: 44px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(120deg, #7aa8ff, #c79bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .overlay p { margin-top: 12px; font-size: 15px; color: #c7d0e8; line-height: 1.8; }
  .bigbtn {
    margin-top: 26px; cursor: pointer; border: none; border-radius: 999px;
    background: #ffd32a; color: #222; font-size: 19px; font-weight: 800;
    padding: 14px 38px;
  }
  .bigbtn:active { transform: scale(.96); }
  .overlay a { color: #9ec2ff; font-size: 14px; margin-top: 18px; }
  /* menu */
  #menu {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(10,16,32,.92); overflow-y: auto; padding: 24px 18px 40px;
  }
  #menu.show { display: block; }
  #menu h2 { text-align: center; font-size: 24px; margin: 8px 0 18px; }
  #menu .mcard {
    display: block; max-width: 520px; margin: 0 auto 12px; padding: 16px 18px;
    border-radius: 16px; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12); color: #fff; text-decoration: none;
  }
  #menu .mcard b { font-size: 18px; }
  #menu .mcard span { display: block; margin-top: 4px; font-size: 13.5px; color: #9fb0d0; line-height: 1.5; }
  #menuClose {
    display: block; margin: 22px auto 0; cursor: pointer;
    border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff;
    border-radius: 999px; padding: 10px 30px; font-size: 15px; font-weight: 700;
  }
  /* touch controls */
  #joy {
    position: fixed; left: 22px; bottom: 76px; width: 120px; height: 120px;
    border-radius: 50%; background: rgba(255,255,255,.14);
    border: 2px solid rgba(255,255,255,.35); z-index: 6; display: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
    margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(255,255,255,.75);
  }
  body.touch #joy { display: block; }
  body.touch #hint { display: none; }
  body.touch #cross { display: none !important; }
  #nogl { display: none; color: #fff; font-size: 16px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div id="title">AxisMotion 世界<small id="subtitle"></small></div>
  <button class="hudbtn" id="btnMenu">📋 <span id="menuLabel"></span></button>
  <button class="hudbtn" id="btnLang">EN</button>
  <div id="cross"></div>
  <div id="prompt"><span id="promptText"></span><button id="btnEnter"></button></div>
  <div id="hint"></div>
</div>

<div id="joy"><div id="joyKnob"></div></div>

<div class="overlay" id="startOverlay">
  <h1>AxisMotion</h1>
  <p id="startText"></p>
  <button class="bigbtn" id="btnStart"></button>
  <a href="#" id="startMenuLink"></a>
  <p id="nogl"></p>
</div>

<div id="menu">
  <h2 id="menuTitle"></h2>
  <div id="menuList"></div>
  <button id="menuClose"></button>
</div>

<script type="module">
'use strict';
import * as THREE from 'three';

/* ============ 应用数据：和原来卡片页同一批入口 ============ */
const APPS = [
  { zh: '打砖块', en: 'Breakout',
    zhDesc: '经典打砖块：掉落道具、连击倍率、多血量砖块',
    enDesc: 'Classic breakout: power-ups, combo multiplier, armored bricks',
    url: 'https://zqfrancis.github.io/Breakout/', color: 0x4da3ff },
  { zh: 'WazaLab', en: 'WazaLab',
    zhDesc: '空手道动作教学 + 对战：每个踢击都有分解讲解',
    enDesc: 'Karate technique lessons + sparring, every kick broken down',
    url: 'https://zqfrancis.github.io/WazaLab/', color: 0xffd32a },
  { zh: 'Sketchy Skier', en: 'Sketchy Skier',
    zhDesc: '画个小人去滑雪：跳台、转体、落地评分',
    enDesc: 'Draw your skier: hit the jump, spin, stick the landing',
    url: 'https://zqfrancis.github.io/SketchySkier/', color: 0x2ed573 },
  { zh: 'FormBuddy', en: 'FormBuddy',
    zhDesc: '动作分析 App',
    enDesc: 'Motion analysis app',
    url: 'https://zqfrancis.github.io/FormBuddy/', color: 0xff9f43 },
  { zh: 'Flappy Bird', en: 'Flappy Bird',
    zhDesc: 'Flappy Bird',
    enDesc: 'Flappy Bird',
    url: 'https://zqfrancis.github.io/maodou-Flappy-Bird/', color: 0x22d3ee },
  { zh: 'Mini Geometry Dash', en: 'Mini Geometry Dash',
    zhDesc: '几何冲刺小游戏：跳过尖刺和方块，通关就赢',
    enDesc: 'Mini geometry dash: jump spikes and blocks to clear the level',
    url: 'https://zqfrancis.github.io/MiniGeometryDash/', color: 0x00ffcc },
  { zh: '毛豆琴音', en: 'MaoDou Piano',
    zhDesc: '练琴计时：只给真正的弹琴计时，Aaron 和 Abigail 各自记录',
    enDesc: 'Piano practice timer: only real playing counts, for Aaron and Abigail',
    url: 'https://zqfrancis.github.io/MaoDouQinYin/', color: 0xe67e22 },
];

const T = {
  zh: { subtitle: '第一人称世界：走到一间房子，就能走进一个应用',
    menu: '应用列表', enter: '进入', hint: '点击画面锁定鼠标 · WASD 移动 · Shift 加速 · 靠近房子按 E 进入',
    start: '欢迎来到 AxisMotion 的世界。<br>这里的每一间房子，都是一个我做的游戏或应用。<br>走过去，推门进去玩。<br>往北走，还有魔法城堡、跨谷高架桥和一列会跑的魔法列车，湖在东边，群山在远处。',
    startBtn: '进入世界', startMenu: '不想走路？直接看应用列表',
    menuTitle: 'AxisMotion 应用列表', classic: '经典列表版（原来那页）', close: '回到世界',
    near: '走进了', nGl: '这个浏览器不支持 3D，试试换个现代浏览器，或去看经典列表版。' },
  en: { subtitle: 'First-person world: walk up to a house to enter an app',
    menu: 'App list', enter: 'Enter', hint: 'Click to lock mouse · WASD to move · Shift to run · Press E near a house',
    start: 'Welcome to the AxisMotion world.<br>Every house here is a game or app I made.<br>Walk up and step inside.<br>Head north for the magic castle, the viaduct and a moving magic train, with a lake to the east and mountains all around.',
    startBtn: 'Enter the world', startMenu: 'Skip walking, show the app list',
    menuTitle: 'AxisMotion apps', classic: 'Classic list page', close: 'Back to the world',
    near: 'You are near', nGl: 'This browser does not support 3D. Try a modern browser, or use the classic list page.' },
};
let lang = localStorage.getItem('axismotion-lang') || 'zh';
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

/* ============ 场景 ============ */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true });
} catch (e) {
  document.getElementById('nogl').textContent = T[lang].nGl;
  document.getElementById('nogl').style.display = 'block';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 70, 230);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 300);
camera.rotation.order = 'YXZ';
let yaw = 0, pitch = 0;
const EYE = 1.7;
const player = new THREE.Vector3(0, EYE, 10); // 出生点：广场南侧，面向房子街
camera.position.copy(player);

scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa55, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(30, 50, 20);
scene.add(sun);

const mat = (c, extra) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, extra || {}));

/* 地面 / 广场 / 小路 */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat(0x5da83a));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const plaza = new THREE.Mesh(new THREE.CircleGeometry(11, 40), mat(0xd9c08a));
plaza.rotation.x = -Math.PI / 2;
plaza.position.set(0, 0.02, 10);
scene.add(plaza);

const path = new THREE.Mesh(new THREE.PlaneGeometry(9, 34), mat(0xcbb27f));
path.rotation.x = -Math.PI / 2;
path.position.set(0, 0.03, -7);
scene.add(path);

/* 房子：沿 z=-28 一字排开，门朝广场(+Z) */
const HOUSES = [];
const signMats = []; // 语言切换时重画
function makeSignTexture(app) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#7a4a21'; g.fillRect(0, 0, 512, 256);
  g.strokeStyle = '#e8c48a'; g.lineWidth = 10; g.strokeRect(12, 12, 488, 232);
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold 64px sans-serif';
  g.fillText(lang === 'zh' ? app.zh : app.en, 256, 108);
  g.font = '28px sans-serif'; g.fillStyle = '#ffd32a';
  g.fillText(lang === 'zh' ? app.en : app.zh, 256, 162);
  g.font = 'bold 30px sans-serif'; g.fillStyle = '#fff';
  g.fillText(lang === 'zh' ? '走近按 E 进入 →' : 'Walk up, press E →', 256, 212);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function buildHouse(app, x) {
  const z = -28, grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(7, 4, 5), mat(0xfff6e8));
  body.position.y = 2; grp.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(5.4, 3, 4), mat(app.color));
  roof.rotation.y = Math.PI / 4; roof.position.y = 5.5; grp.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.5, 0.25), mat(0x5a3a1e));
  door.position.set(0, 1.25, 2.6); grp.add(door);
  for (const wx of [-2.2, 2.2]) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.15), mat(0xbfe8ff));
    win.position.set(wx, 2.3, 2.55); grp.add(win);
  }
  // 招牌：两根柱子 + 板
  const signTex = makeSignTexture(app);
  const signMat = new THREE.MeshBasicMaterial({ map: signTex, side: THREE.DoubleSide });
  signMats.push({ app, mat: signMat });
  const board = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 3.2), signMat);
  board.position.set(0, 3.4, 5.2); grp.add(board);
  for (const px of [-2.8, 2.8]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.2, 8), mat(0x5a3a1e));
    post.position.set(px, 1.1, 5.2); grp.add(post);
  }
  grp.position.set(x, 0, z);
  scene.add(grp);
  HOUSES.push({ app, x, z, doorZ: z + 2.6, hx: 4.0, hz: 4.2 });
}
APPS.forEach((a, i) => buildHouse(a, -36 + i * 12));

/* 树 / 石头：避开房子街和广场 */
function tree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 8), mat(0x7a4a21));
  trunk.position.y = 1; g.add(trunk);
  const c1 = new THREE.Mesh(new THREE.ConeGeometry(2.2, 4.5, 8), mat(0x2e7d32));
  c1.position.y = 4; g.add(c1);
  const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), mat(0x388e3c));
  c2.position.y = 6.2; g.add(c2);
  g.position.set(x, 0, z); scene.add(g);
}
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 30; i++) {
  const a = rnd() * Math.PI * 2, r = 38 + rnd() * 50;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (z > -38 && z < 22 && Math.abs(x) < 48) continue; // 房子街和广场留空
  if (Math.abs(x) < 24 && z > -95 && z < -62) continue; // 魔法城堡留空
  if (Math.hypot(x - 58, z - 15) < 24) continue; // 湖留空
  if (Math.abs(z + 60) < 8 && Math.abs(x) < 78) continue; // 高架桥留空
  tree(x, z);
  if (i % 4 === 0) {
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8 + rnd(), 0), mat(0x9aa0a6));
    rock.position.set(x + 4, 0.5, z + 3); scene.add(rock);
  }
}

/* ============ 魔法区：城堡 / 湖 / 群山 / 高架桥 / 列车（原创低模造型） ============ */
const EXTRA_BOXES = [];
const CIRCLES = [];

// ---- 湖（东边） ----
const LAKE = { x: 58, z: 15, r: 18 };
const rim = new THREE.Mesh(new THREE.CircleGeometry(LAKE.r + 1.5, 40), mat(0xd9c08a));
rim.rotation.x = -Math.PI / 2; rim.position.set(LAKE.x, 0.04, LAKE.z); scene.add(rim);
const water = new THREE.Mesh(new THREE.CircleGeometry(LAKE.r, 40),
  new THREE.MeshLambertMaterial({ color: 0x2b6cb0, transparent: true, opacity: 0.92 }));
water.rotation.x = -Math.PI / 2; water.position.set(LAKE.x, 0.09, LAKE.z); scene.add(water);
CIRCLES.push(LAKE);

// ---- 群山（远景） ----
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2 + 0.3;
  const r = 135 + (i % 3) * 12, h = 30 + (i % 4) * 6, br = 20 + (i % 3) * 5;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  const m = new THREE.Mesh(new THREE.ConeGeometry(br, h, 7), mat(0x6b7f99));
  m.position.set(x, h / 2 - 1, z); scene.add(m);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(br * 0.34, h * 0.3, 7), mat(0xffffff));
  cap.position.set(x, h * 0.86 - 1, z); scene.add(cap);
}
for (let i = 0; i < 6; i++) { // 近处绿丘
  const a = (i / 6) * Math.PI * 2 + 1.1, r = 108;
  const hill = new THREE.Mesh(new THREE.ConeGeometry(16, 12, 8), mat(0x4c9440));
  hill.position.set(Math.cos(a) * r, 5, Math.sin(a) * r); scene.add(hill);
}

// ---- 魔法城堡（北边山坡上） ----
function makeCastleSign() {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#4a3b28'; g.fillRect(0, 0, 512, 256);
  g.strokeStyle = '#e8c48a'; g.lineWidth = 10; g.strokeRect(12, 12, 488, 232);
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold 64px sans-serif';
  g.fillText(lang === 'zh' ? '魔法城堡' : 'Magic Castle', 256, 108);
  g.font = '28px sans-serif'; g.fillStyle = '#ffd32a';
  g.fillText(lang === 'zh' ? 'Magic Castle' : '魔法城堡', 256, 162);
  g.font = 'bold 30px sans-serif'; g.fillStyle = '#fff';
  g.fillText(lang === 'zh' ? '魔法世界地标' : 'Landmark of the magic world', 256, 212);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
const castle = new THREE.Group();
const stone = 0x9a8f7d, spireCol = 0x3a4a6b;
const cHill = new THREE.Mesh(new THREE.CylinderGeometry(24, 30, 4, 10), mat(0x5d7a45));
cHill.position.y = 2; castle.add(cHill);
const keep = new THREE.Mesh(new THREE.BoxGeometry(16, 13, 11), mat(stone));
keep.position.y = 4 + 6.5; castle.add(keep);
const hall = new THREE.Mesh(new THREE.BoxGeometry(9, 8, 17), mat(stone));
hall.position.set(-12, 4 + 4, 1); castle.add(hall);
function tower(x, z, h, r) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(r, r + 0.3, h, 10), mat(stone));
  t.position.set(x, 4 + h / 2, z); castle.add(t);
  const sp = new THREE.Mesh(new THREE.ConeGeometry(r + 0.6, 6, 10), mat(spireCol));
  sp.position.set(x, 4 + h + 3, z); castle.add(sp);
}
tower(-8, -5, 17, 2.4); tower(8, -5, 20, 2.4); tower(-8, 5, 14, 2.1); tower(8, 5, 16, 2.1);
tower(0, -5, 24, 2.6); tower(-13, 1, 11, 1.9);
const winMat = new THREE.MeshBasicMaterial({ color: 0xffd76a });
for (let i = 0; i < 18; i++) {
  const w = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.15), winMat);
  w.position.set(-6 + (i % 6) * 2.4, 7.5 + Math.floor(i / 6) * 3.2, 5.55); castle.add(w);
}
const gate = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.6, 0.3), mat(0x3a2c1c));
gate.position.set(0, 4 + 1.8, 5.6); castle.add(gate);
const cSignMat = new THREE.MeshBasicMaterial({ map: makeCastleSign(), side: THREE.DoubleSide });
signMats.push({ castle: true, mat: cSignMat });
const cBoard = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 3.2), cSignMat);
cBoard.position.set(0, 3.4, 9.5); castle.add(cBoard);
for (const px of [-2.8, 2.8]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.2, 8), mat(0x5a3a1e));
  post.position.set(px, 1.1, 9.5); castle.add(post);
}
castle.position.set(0, 0, -78);
scene.add(castle);
EXTRA_BOXES.push({ x: 0, z: -78, hx: 15, hz: 11 });

// ---- 高架桥 + 魔法列车（东西向，横在城堡前方） ----
const VIA_Z = -60;
const deck = new THREE.Mesh(new THREE.BoxGeometry(150, 1.2, 4.5), mat(0x8a8578));
deck.position.set(0, 5, VIA_Z); scene.add(deck);
for (const rx of [-0.9, 0.9]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(150, 0.18, 0.18), mat(0x3c3c3c));
  rail.position.set(0, 5.7, VIA_Z + rx); scene.add(rail);
}
for (let x = -66; x <= 66; x += 12) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(2.6, 5, 3.6), mat(0x7d7869));
  p.position.set(x, 2.5, VIA_Z); scene.add(p);
  EXTRA_BOXES.push({ x, z: VIA_Z, hx: 1.7, hz: 2.2 });
}
const train = new THREE.Group();
const loco = new THREE.Group();
const lb = new THREE.Mesh(new THREE.BoxGeometry(6.5, 2.4, 2.6), mat(0x1c1c22));
lb.position.y = 1.2; loco.add(lb);
const cab = new THREE.Mesh(new THREE.BoxGeometry(2, 2.2, 2.6), mat(0x1c1c22));
cab.position.set(-2.4, 3.2, 0); loco.add(cab);
const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 1.4, 10), mat(0x1c1c22));
chimney.position.set(2.8, 3.1, 0); loco.add(chimney);
const stripe = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.4, 2.7), mat(0xa31616));
stripe.position.y = 0.5; loco.add(stripe);
train.add(loco);
[0x7a1f1f, 0x7a1f1f, 0x5a2a1a].forEach((c, i) => {
  const car = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(5.2, 2.4, 2.6), mat(c));
  b.position.y = 1.2; car.add(b);
  const strip = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.8, 2.7), mat(0xf3e3c0));
  strip.position.y = 1.6; car.add(strip);
  car.position.x = -6.4 - i * 6.2; train.add(car);
});
train.position.set(-60, 5.7, VIA_Z);
scene.add(train);
let trainDir = 1, trainX = -60;
const smokeGeo = new THREE.SphereGeometry(0.55, 8, 8);
const puffs = [];
for (let i = 0; i < 14; i++) {
  const m = new THREE.Mesh(smokeGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
  m.visible = false; scene.add(m);
  puffs.push({ mesh: m, age: 0, active: false });
}
let puffTimer = 0, puffIdx = 0;
function updateTrain(dt) {
  trainX += trainDir * 9 * dt;
  if (trainX > 62) { trainX = 62; trainDir = -1; train.rotation.y = Math.PI; }
  if (trainX < -62) { trainX = -62; trainDir = 1; train.rotation.y = 0; }
  train.position.x = trainX;
  puffTimer -= dt;
  if (puffTimer <= 0) {
    puffTimer = 0.14;
    const p = puffs[puffIdx]; puffIdx = (puffIdx + 1) % puffs.length;
    p.active = true; p.age = 0; p.mesh.visible = true;
    p.mesh.position.set(trainX + trainDir * 2.8, 9.6, VIA_Z);
  }
  for (const p of puffs) {
    if (!p.active) continue;
    p.age += dt;
    if (p.age > 2.2) { p.active = false; p.mesh.visible = false; continue; }
    p.mesh.position.y += 1.6 * dt;
    const s = 1 + p.age * 1.4; p.mesh.scale.set(s, s, s);
    p.mesh.material.opacity = 0.65 * (1 - p.age / 2.2);
  }
}

/* ============ 移动 / 碰撞 / 传送门 ============ */
const keys = {};
let locked = false, nearHouse = null;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE' && nearHouse) window.location.href = nearHouse.app.url;
});
addEventListener('keyup', e => keys[e.code] = false);

const canvas = document.getElementById('scene');
canvas.addEventListener('click', () => {
  if (!isTouch && !locked && document.getElementById('startOverlay').classList.contains('hidden'))
    canvas.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  document.getElementById('cross').style.display = locked ? 'block' : 'none';
  if (!locked && document.getElementById('menu').classList.contains('show') === false) {
    // 退出锁定后回到开始界面（除非正在看菜单）
    if (started) showStart(true);
  }
});
document.addEventListener('mousemove', e => {
  if (!locked) return;
  yaw -= e.movementX * 0.0022;
  pitch = Math.max(-1.2, Math.min(1.2, pitch - e.movementY * 0.0022));
});

/* 手机：左摇杆移动，右半屏拖动看方向 */
let joyVec = { x: 0, y: 0 }, lookId = null, lastLook = null;
const joy = document.getElementById('joy'), knob = document.getElementById('joyKnob');
let joyId = null;
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); });
joy.addEventListener('pointermove', e => {
  if (e.pointerId !== joyId) return;
  const r = joy.getBoundingClientRect();
  let dx = (e.clientX - (r.left + r.width / 2)) / 50;
  let dy = (e.clientY - (r.top + r.height / 2)) / 50;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  joyVec = { x: dx, y: dy };
  knob.style.transform = 'translate(' + (dx * 30) + 'px,' + (dy * 30) + 'px)';
});
const joyEnd = e => {
  if (e.pointerId !== joyId) return;
  joyId = null; joyVec = { x: 0, y: 0 }; knob.style.transform = '';
};
joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);
canvas.addEventListener('pointerdown', e => {
  if (!isTouch) return;
  if (e.target !== canvas) return;
  lookId = e.pointerId; lastLook = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== lookId || !lastLook) return;
  yaw -= (e.clientX - lastLook.x) * 0.005;
  pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - lastLook.y) * 0.005));
  lastLook = { x: e.clientX, y: e.clientY };
});
const lookEnd = e => { if (e.pointerId === lookId) { lookId = null; lastLook = null; } };
canvas.addEventListener('pointerup', lookEnd);
canvas.addEventListener('pointercancel', lookEnd);

function collide(p) {
  for (const h of HOUSES) {
    const dx = p.x - h.x, dz = p.z - h.z;
    if (Math.abs(dx) < h.hx + 0.6 && Math.abs(dz) < h.hz + 0.6) {
      const px = h.hx + 0.6 - Math.abs(dx), pz = h.hz + 0.6 - Math.abs(dz);
      if (px < pz) p.x = h.x + Math.sign(dx || 1) * (h.hx + 0.6);
      else p.z = h.z + Math.sign(dz || 1) * (h.hz + 0.6);
    }
  }
  for (const b of EXTRA_BOXES) {
    const dx = p.x - b.x, dz = p.z - b.z;
    if (Math.abs(dx) < b.hx + 0.6 && Math.abs(dz) < b.hz + 0.6) {
      const px = b.hx + 0.6 - Math.abs(dx), pz = b.hz + 0.6 - Math.abs(dz);
      if (px < pz) p.x = b.x + Math.sign(dx || 1) * (b.hx + 0.6);
      else p.z = b.z + Math.sign(dz || 1) * (b.hz + 0.6);
    }
  }
  for (const c of CIRCLES) {
    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz);
    if (d < c.r + 0.6) {
      if (d < 0.001) p.z = c.z + c.r + 0.6;
      else { p.x = c.x + dx / d * (c.r + 0.6); p.z = c.z + dz / d * (c.r + 0.6); }
    }
  }
  p.x = Math.max(-95, Math.min(95, p.x));
  p.z = Math.max(-95, Math.min(95, p.z));
}

const promptEl = document.getElementById('prompt');
const promptText = document.getElementById('promptText');
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 16 : 9;
  let fx = 0, fz = 0;
  if (keys['KeyW'] || keys['ArrowUp']) fz -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) fz += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) fx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) fx += 1;
  fx += joyVec.x; fz += joyVec.y;
  const len = Math.hypot(fx, fz);
  if (len > 0) {
    fx /= Math.max(1, len); fz /= Math.max(1, len);
    const sin = Math.sin(yaw), cos = Math.cos(yaw);
    player.x += (-sin * -fz + cos * fx) * speed * dt;
    player.z += (-cos * -fz - sin * fx) * speed * dt;
  }
  collide(player);
  camera.position.copy(player);
  camera.rotation.y = yaw; camera.rotation.x = pitch;
  // 最近的房子门
  nearHouse = null;
  let best = 6.5;
  for (const h of HOUSES) {
    const d = Math.hypot(player.x - h.x, player.z - h.doorZ);
    if (d < best) { best = d; nearHouse = h; }
  }
  if (nearHouse) {
    promptText.textContent = T[lang].near + ' ' + (lang === 'zh' ? nearHouse.app.zh : nearHouse.app.en);
    promptEl.classList.add('show');
  } else promptEl.classList.remove('show');
  updateTrain(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

/* ============ 界面文案 / 菜单 / 语言 ============ */
let started = false;
function showStart(resume) {
  const ov = document.getElementById('startOverlay');
  ov.classList.remove('hidden');
  document.getElementById('btnStart').textContent = resume ? (lang === 'zh' ? '继续漫步' : 'Continue') : T[lang].startBtn;
}
function applyLang() {
  const t = T[lang];
  document.getElementById('subtitle').textContent = t.subtitle;
  document.getElementById('menuLabel').textContent = t.menu;
  document.getElementById('btnLang').textContent = lang === 'zh' ? 'EN' : '中文';
  document.getElementById('btnEnter').textContent = t.enter;
  document.getElementById('hint').textContent = isTouch
    ? (lang === 'zh' ? '左摇杆移动 · 右半屏拖动看方向 · 靠近房子点进入' : 'Left stick to move · drag right side to look · tap Enter near a house')
    : t.hint;
  document.getElementById('startText').innerHTML = t.start;
  if (!started) document.getElementById('btnStart').textContent = t.startBtn;
  document.getElementById('startMenuLink').textContent = t.startMenu;
  document.getElementById('menuTitle').textContent = t.menuTitle;
  document.getElementById('menuClose').textContent = t.close;
  const list = document.getElementById('menuList');
  list.innerHTML = '';
  for (const a of APPS) {
    const el = document.createElement('a');
    el.className = 'mcard'; el.href = a.url;
    el.innerHTML = '<b>' + (lang === 'zh' ? a.zh : a.en) + '</b><span>' + (lang === 'zh' ? a.zhDesc : a.enDesc) + '</span>';
    list.appendChild(el);
  }
  const cl = document.createElement('a');
  cl.className = 'mcard'; cl.href = 'classic.html';
  cl.innerHTML = '<b>' + t.classic + '</b>';
  list.appendChild(cl);
  for (const s of signMats) {
    s.mat.map = s.castle ? makeCastleSign() : makeSignTexture(s.app);
    s.mat.needsUpdate = true;
  }
}
document.getElementById('btnLang').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('axismotion-lang', lang);
  applyLang();
});
document.getElementById('btnStart').addEventListener('click', () => {
  started = true;
  document.getElementById('startOverlay').classList.add('hidden');
  if (!isTouch) canvas.requestPointerLock();
});
document.getElementById('btnMenu').addEventListener('click', () => {
  document.getElementById('menu').classList.add('show');
  if (document.pointerLockElement) document.exitPointerLock();
});
document.getElementById('startMenuLink').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('menu').classList.add('show');
});
document.getElementById('menuClose').addEventListener('click', () => {
  document.getElementById('menu').classList.remove('show');
  if (started && !isTouch) canvas.requestPointerLock();
});
document.getElementById('btnEnter').addEventListener('click', () => {
  if (nearHouse) window.location.href = nearHouse.app.url;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
applyLang();
</script>
</body>
