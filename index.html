<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>AxisMotion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: #0b1020;
    color: #eef2ff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(600px 300px at 20% -5%, rgba(80,120,255,.18), transparent),
      radial-gradient(500px 260px at 85% 10%, rgba(165,94,234,.14), transparent),
      #0b1020;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 40px; }
  header { text-align: center; padding: 26px 0 8px; position: relative; }
  .logo {
    font-size: 40px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(120deg, #7aa8ff, #c79bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { margin-top: 8px; color: #8b98b8; font-size: 15px; }
  #langBtn {
    position: absolute; top: 0; right: 0;
    padding: 7px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.06); color: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #langBtn:active { transform: scale(.94); }
  .grid { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    padding: 18px; border-radius: 18px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09);
    text-decoration: none; color: inherit;
    transition: transform .12s ease, background .12s ease;
    position: relative; overflow: hidden;
  }
  .card:active { transform: scale(.98); background: rgba(255,255,255,.08); }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--accent, #7aa8ff);
    box-shadow: 0 0 14px var(--accent, #7aa8ff);
  }
  .thumb {
    width: 84px; height: 112px; flex: none; object-fit: cover;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.12);
    background: #141b33;
  }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 19px; font-weight: 700; }
  .desc { margin-top: 5px; font-size: 13.5px; color: #8b98b8; line-height: 1.5; }
  .go { font-size: 22px; color: #5b6b8c; flex: none; }
  footer { text-align: center; margin-top: 30px; color: #5b6b8c; font-size: 13px; line-height: 1.8; }
  footer .tip { color: #8b98b8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="langBtn">EN</button>
    <div class="logo">AxisMotion</div>
    <div class="tagline" id="tagline"></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    <div class="tip" id="tip"></div>
    <div>© 2026 AxisMotion</div>
  </footer>
</div>
<script>
'use strict';
/* AxisMotion 总页：所有作品的唯一入口。新增作品时，只需往 APPS 数组加一行。 */

const APPS = [
  { img: 'thumbs/breakout.webp', zh: '打砖块', en: 'Breakout',
    zhDesc: '经典打砖块：掉落道具、连击倍率、多血量砖块',
    enDesc: 'Classic breakout: power-ups, combo multiplier, armored bricks',
    url: 'https://zqfrancis.github.io/Breakout/', accent: '#4da3ff' },
  { img: 'thumbs/wazalab.webp', zh: 'WazaLab', en: 'WazaLab',
    zhDesc: '空手道动作教学 + 对战：每个踢击都有分解讲解',
    enDesc: 'Karate technique lessons + sparring, every kick broken down',
    url: 'https://zqfrancis.github.io/WazaLab/', accent: '#ffd32a' },
  { img: 'thumbs/sketchyskier.webp', zh: 'Sketchy Skier', en: 'Sketchy Skier',
    zhDesc: '画个小人去滑雪：跳台、转体、落地评分',
    enDesc: 'Draw your skier: hit the jump, spin, stick the landing',
    url: 'https://zqfrancis.github.io/SketchySkier/', accent: '#2ed573' },
  { img: 'thumbs/formbuddy.webp', zh: 'FormBuddy', en: 'FormBuddy',
    zhDesc: '动作分析 App',
    enDesc: 'Motion analysis app',
    url: 'https://zqfrancis.github.io/FormBuddy/', accent: '#ff9f43' },
  { img: 'thumbs/flappy.webp', zh: 'Flappy Bird', en: 'Flappy Bird',
    zhDesc: 'Flappy Bird',
    enDesc: 'Flappy Bird',
    url: 'https://zqfrancis.github.io/maodou-Flappy-Bird/', accent: '#22d3ee' },
  { img: 'thumbs/minigeometrydash.webp', zh: 'Mini Geometry Dash', en: 'Mini Geometry Dash',
    zhDesc: '几何冲刺小游戏：跳过尖刺和方块，通关就赢',
    enDesc: 'Mini geometry dash: jump spikes and blocks to clear the level',
    url: 'https://zqfrancis.github.io/MiniGeometryDash/', accent: '#00ffcc' },
  { img: 'thumbs/maodouqinyin.webp', zh: '毛豆琴音', en: 'MaoDou Piano',
    zhDesc: '练琴计时：只给真正的弹琴计时，Aaron 和 Abigail 各自记录',
    enDesc: 'Piano practice timer: only real playing counts, for Aaron and Abigail',
    url: 'https://zqfrancis.github.io/MaoDouQinYin/', accent: '#e67e22' },
];

const T = {
  zh: { tagline: '游戏与应用作品集', tip: '把这页加到手机主屏幕，一个书签进所有应用 📌', btn: 'EN', title: 'AxisMotion' },
  en: { tagline: 'Games & apps portfolio', tip: 'Add this page to your home screen — one bookmark for everything 📌', btn: '中文', title: 'AxisMotion' },
};
let lang = localStorage.getItem('axismotion-lang') || 'zh';

function render() {
  const t = T[lang];
  document.title = t.title;
  document.getElementById('langBtn').textContent = t.btn;
  document.getElementById('tagline').textContent = t.tagline;
  document.getElementById('tip').textContent = t.tip;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const a of APPS) {
    const el = document.createElement('a');
    el.className = 'card';
    el.href = a.url;
    el.style.setProperty('--accent', a.accent);
    el.innerHTML =
      '<img class="thumb" src="' + a.img + '" alt="">' +
      '<div class="info"><div class="name">' + (lang === 'zh' ? a.zh : a.en) + '</div>' +
      '<div class="desc">' + (lang === 'zh' ? a.zhDesc : a.enDesc) + '</div></div>' +
      '<div class="go">›</div>';
    grid.appendChild(el);
  }
}
document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('axismotion-lang', lang);
  render();
});
render();
</script>
</body>
</html>
