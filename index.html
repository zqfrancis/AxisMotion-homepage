<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#87ceeb">
<title>AxisMotion 世界</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #87ceeb; color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #title {
    position: absolute; top: 14px; left: 16px;
    font-size: 22px; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,.45);
  }
  #title small { display: block; font-size: 12.5px; font-weight: 400; opacity: .9; margin-top: 2px; }
  .hudbtn {
    pointer-events: auto; cursor: pointer; border: 1px solid rgba(255,255,255,.5);
    background: rgba(0,0,0,.35); color: #fff; border-radius: 999px;
    padding: 8px 16px; font-size: 14px; font-weight: 700;
  }
  .hudbtn:active { transform: scale(.94); }
  #btnMenu { position: absolute; top: 14px; right: 16px; }
  #btnLang { position: absolute; top: 56px; right: 16px; }
  #cross {
    position: absolute; left: 50%; top: 50%; width: 8px; height: 8px;
    margin: -4px 0 0 -4px; border-radius: 50%;
    background: rgba(255,255,255,.9); box-shadow: 0 0 6px rgba(0,0,0,.6);
    display: none;
  }
  #prompt {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    display: none; align-items: center; gap: 12px;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35);
    border-radius: 14px; padding: 12px 16px; font-size: 16px; font-weight: 700;
    white-space: nowrap;
  }
  #prompt.show { display: flex; }
  #btnEnter {
    pointer-events: auto; cursor: pointer; border: none; border-radius: 10px;
    background: #ffd32a; color: #222; font-size: 16px; font-weight: 800;
    padding: 8px 18px;
  }
  #btnEnter:active { transform: scale(.94); }
  #hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    font-size: 13px; background: rgba(0,0,0,.35); border-radius: 999px;
    padding: 6px 14px; white-space: nowrap;
  }
  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,16,32,.72); text-align: center; padding: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: 44px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(120deg, #7aa8ff, #c79bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .overlay p { margin-top: 12px; font-size: 15px; color: #c7d0e8; line-height: 1.8; }
  .bigbtn {
    margin-top: 26px; cursor: pointer; border: none; border-radius: 999px;
    background: #ffd32a; color: #222; font-size: 19px; font-weight: 800;
    padding: 14px 38px;
  }
  .bigbtn:active { transform: scale(.96); }
  .overlay a { color: #9ec2ff; font-size: 14px; margin-top: 18px; }
  /* menu */
  #menu, #selectPanel {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(10,16,32,.92); overflow-y: auto; padding: 24px 18px 40px;
  }
  #menu.show, #selectPanel.show { display: block; }
  #menu h2, #selectPanel h2 { text-align: center; font-size: 24px; margin: 8px 0 18px; }
  #menu .mcard, #selectPanel .mcard {
    display: block; max-width: 520px; margin: 0 auto 12px; padding: 16px 18px;
    border-radius: 16px; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12); color: #fff; text-decoration: none;
  }
  #menu .mcard b, #selectPanel .mcard b { font-size: 18px; }
  #menu .mcard span, #selectPanel .mcard span { display: block; margin-top: 4px; font-size: 13.5px; color: #9fb0d0; line-height: 1.5; }
  #menuClose, #selectClose {
    display: block; margin: 22px auto 0; cursor: pointer;
    border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff;
    border-radius: 999px; padding: 10px 30px; font-size: 15px; font-weight: 700;
  }
  /* touch controls */
  #joy {
    position: fixed; left: 22px; bottom: 76px; width: 120px; height: 120px;
    border-radius: 50%; background: rgba(255,255,255,.14);
    border: 2px solid rgba(255,255,255,.35); z-index: 6; display: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
    margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(255,255,255,.75);
  }
  body.touch #joy { display: block; }
  body.touch #hint { display: none; }
  body.touch #cross { display: none !important; }
  #nogl { display: none; color: #fff; font-size: 16px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div id="title">AxisMotion 世界<small id="subtitle"></small></div>
  <button class="hudbtn" id="btnMenu">📋 <span id="menuLabel"></span></button>
  <button class="hudbtn" id="btnLang">EN</button>
  <div id="cross"></div>
  <div id="prompt"><span id="promptText"></span><button id="btnEnter"></button></div>
  <div id="hint"></div>
</div>

<div id="joy"><div id="joyKnob"></div></div>

<div class="overlay" id="startOverlay">
  <h1>AxisMotion</h1>
  <p id="startText"></p>
  <button class="bigbtn" id="btnStart"></button>
  <a href="#" id="startMenuLink"></a>
  <p id="nogl"></p>
</div>

<div id="menu">
  <h2 id="menuTitle"></h2>
  <div id="menuList"></div>
  <button id="menuClose"></button>
</div>

<div id="selectPanel">
  <h2 id="selectTitle"></h2>
  <div id="selectList"></div>
  <button id="selectClose"></button>
</div>

<script type="module">
'use strict';
import * as THREE from 'three';

/* ============ 应用数据：和原来卡片页同一批入口 ============ */
const APPS = [
  { zh: '打砖块', en: 'Breakout',
    zhDesc: '经典打砖块：掉落道具、连击倍率、多血量砖块',
    enDesc: 'Classic breakout: power-ups, combo multiplier, armored bricks',
    url: 'https://zqfrancis.github.io/Breakout/', color: 0x4da3ff },
  { zh: 'WazaLab', en: 'WazaLab',
    zhDesc: '空手道动作教学 + 对战：每个踢击都有分解讲解',
    enDesc: 'Karate technique lessons + sparring, every kick broken down',
    url: 'https://zqfrancis.github.io/WazaLab/', color: 0xffd32a },
  { zh: 'Sketchy Skier', en: 'Sketchy Skier',
    zhDesc: '画个小人去滑雪：跳台、转体、落地评分',
    enDesc: 'Draw your skier: hit the jump, spin, stick the landing',
    url: 'https://zqfrancis.github.io/SketchySkier/', color: 0x2ed573 },
  { zh: 'FormBuddy', en: 'FormBuddy',
    zhDesc: '动作分析 App',
    enDesc: 'Motion analysis app',
    url: 'https://zqfrancis.github.io/FormBuddy/', color: 0xff9f43 },
  { zh: 'Flappy Bird', en: 'Flappy Bird',
    zhDesc: 'Flappy Bird',
    enDesc: 'Flappy Bird',
    url: 'https://zqfrancis.github.io/maodou-Flappy-Bird/', color: 0x22d3ee },
  { zh: 'Mini Geometry Dash', en: 'Mini Geometry Dash',
    zhDesc: '几何冲刺小游戏：跳过尖刺和方块，通关就赢',
    enDesc: 'Mini geometry dash: jump spikes and blocks to clear the level',
    url: 'https://zqfrancis.github.io/MiniGeometryDash/', color: 0x00ffcc },
  { zh: '毛豆琴音', en: 'MaoDou Piano',
    zhDesc: '练琴计时：只给真正的弹琴计时，Aaron 和 Abigail 各自记录',
    enDesc: 'Piano practice timer: only real playing counts, for Aaron and Abigail',
    url: 'https://zqfrancis.github.io/MaoDouQinYin/', color: 0xe67e22 },
];

const T = {
  zh: { subtitle: '第一人称世界：三间房子，推门进去各有天地',
    menu: '应用列表', hint: '点击画面锁定鼠标 · WASD 移动 · Shift 加速 · 靠近门口按 E',
    start: '欢迎来到 AxisMotion 的世界。<br>现在有三间可以走进去的房子：游戏屋、道馆、琴房。<br>推门进去，里面各有天地。<br>往北走，还有魔法城堡、跨谷高架桥和一列会跑的魔法列车，湖在东边，群山在远处。',
    startBtn: '进入世界', startMenu: '不想走路？直接看应用列表',
    menuTitle: 'AxisMotion 应用列表', classic: '经典列表版（原来那页）', close: '回到世界',
    selectTitle: '选个游戏玩', nGl: '这个浏览器不支持 3D，试试换个现代浏览器，或去看经典列表版。' },
  en: { subtitle: 'First-person world: three houses you can actually walk into',
    menu: 'App list', hint: 'Click to lock mouse · WASD to move · Shift to run · Press E near a door',
    start: 'Welcome to the AxisMotion world.<br>Three houses are open now: the Game House, the Dojo, and the Piano Room.<br>Push the door and step inside.<br>Head north for the magic castle, the viaduct and a moving magic train, with a lake to the east and mountains all around.',
    startBtn: 'Enter the world', startMenu: 'Skip walking, show the app list',
    menuTitle: 'AxisMotion apps', classic: 'Classic list page', close: 'Back to the world',
    selectTitle: 'Pick a game', nGl: 'This browser does not support 3D. Try a modern browser, or use the classic list page.' },
};
let lang = localStorage.getItem('axismotion-lang') || 'zh';
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

/* ============ 场景 ============ */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true });
} catch (e) {
  document.getElementById('nogl').textContent = T[lang].nGl;
  document.getElementById('nogl').style.display = 'block';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
// 黄昏：开阴影，太阳压低后才有长影
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
// 黄昏天色：暖暮橙（旧 0x87ceeb 正午亮蓝天，与暖窗冲突）
scene.background = new THREE.Color(0xe08a5c);
scene.fog = new THREE.Fog(0xd98a63, 70, 230);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 300);
camera.rotation.order = 'YXZ';
let yaw = 0, pitch = 0;
const EYE = 1.7;
const player = new THREE.Vector3(0, EYE, 10); // 出生点：广场南侧，面向房子街
camera.position.copy(player);

// 黄昏光：淡紫暮色半球光 + 低角度暖太阳（西边，-X），取代正午顶光
scene.add(new THREE.HemisphereLight(0x9a7bb0, 0x6b4a35, 0.6));
const sun = new THREE.DirectionalLight(0xffb36b, 1.5);
sun.position.set(-70, 16, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 260;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun);

const mat = (c, extra) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, extra || {}));

/* 地面 / 广场 / 小路 */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat(0x5da83a));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const plaza = new THREE.Mesh(new THREE.CircleGeometry(11, 40), mat(0xd9c08a));
plaza.rotation.x = -Math.PI / 2;
plaza.position.set(0, 0.02, 10);
plaza.receiveShadow = true;
scene.add(plaza);

const path = new THREE.Mesh(new THREE.PlaneGeometry(9, 34), mat(0xcbb27f));
path.rotation.x = -Math.PI / 2;
path.position.set(0, 0.03, -7);
path.receiveShadow = true;
scene.add(path);

/* 三间房子：沿 z=-28 一字排开，门朝广场(+Z)，都能推门走进去 */
const HOUSES = [];
const signMats = []; // 语言切换时重画
function makeSignTexture(app) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#7a4a21'; g.fillRect(0, 0, 512, 256);
  g.strokeStyle = '#e8c48a'; g.lineWidth = 10; g.strokeRect(12, 12, 488, 232);
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold 64px sans-serif';
  g.fillText(lang === 'zh' ? app.zh : app.en, 256, 108);
  g.font = '28px sans-serif'; g.fillStyle = '#ffd32a';
  g.fillText(lang === 'zh' ? app.en : app.zh, 256, 162);
  g.font = 'bold 30px sans-serif'; g.fillStyle = '#fff';
  g.fillText(lang === 'zh' ? '走近按 E 进入 →' : 'Walk up, press E →', 256, 212);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function buildHouse(h, x) {
  const z = -28, grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(10, 4.5, 7), mat(h.body));
  body.position.y = 2.25; body.castShadow = true; body.receiveShadow = true; grp.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(7.4, 3.5, 4), mat(h.roof));
  roof.rotation.y = Math.PI / 4; roof.position.y = 6.25; roof.castShadow = true; grp.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.8, 0.25), mat(h.door));
  door.position.set(0, 1.4, 3.6); grp.add(door);
  // 黄昏窗：暖光窗格 + 深色木窗框（旧淡蓝玻璃在黄昏里不成立）
  for (const wx of [-3.2, 3.2]) {
    const frame = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.7, 0.1), mat(0x5a3a1e));
    frame.position.set(wx, 2.5, 3.53); grp.add(frame);
    const win = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 0.15), new THREE.MeshBasicMaterial({ color: 0xffc46b }));
    win.position.set(wx, 2.5, 3.58); grp.add(win);
  }
  const signMat = new THREE.MeshBasicMaterial({ map: makeSignTexture(h), side: THREE.DoubleSide });
  signMats.push({ app: h, mat: signMat });
  const board = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 3.2), signMat);
  board.position.set(0, 3.6, 5.4); grp.add(board);
  for (const px of [-2.8, 2.8]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.4, 8), mat(0x5a3a1e));
    post.position.set(px, 1.2, 5.4); grp.add(post);
  }
  if (h.kind === 'dojo') { // 道馆门口两盏灯笼
    for (const lx of [-4.2, 4.2]) {
      const lp = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.2, 8), mat(0x3a2c1c));
      lp.position.set(lx, 1.1, 4.6); grp.add(lp);
      const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.6), new THREE.MeshBasicMaterial({ color: 0xffd76a }));
      lamp.position.set(lx, 2.6, 4.6); grp.add(lamp);
    }
  }
  grp.position.set(x, 0, z);
  scene.add(grp);
  HOUSES.push({ kind: h.kind, zh: h.zh, en: h.en, x, z, doorZ: z + 3.6, hx: 5.5, hz: 5.0 });
}
buildHouse({ kind: 'game', zh: '游戏屋', en: 'Game House', roof: 0x4da3ff, body: 0xfff6e8, door: 0x5a3a1e }, -20);
buildHouse({ kind: 'dojo', zh: '道馆', en: 'Dojo', roof: 0x3a3f4a, body: 0xf5f0e6, door: 0xa31616 }, 0);
buildHouse({ kind: 'piano', zh: '琴房', en: 'Piano Room', roof: 0x6b5a8a, body: 0xfdf8ec, door: 0x3a2c1c }, 20);
// 两侧小路
for (const px of [-20, 20]) {
  const side = new THREE.Mesh(new THREE.PlaneGeometry(5, 34), mat(0xcbb27f));
  side.rotation.x = -Math.PI / 2;
  side.position.set(px, 0.03, -7);
  side.receiveShadow = true;
  scene.add(side);
}

// 黄昏路灯：沿主路两侧交错布设，灯头暖光自发光；其中 3 盏带暖色点光源，
// 在黄昏里形成第二层光（光池落在小路上），不是白天摆件
const lampGlow = new THREE.MeshBasicMaterial({ color: 0xffd76a });
const lampLightPos = [];
for (const [lx, lz] of [[5.2, 8], [-5.2, 0], [5.2, -8], [-5.2, -16], [5.2, -24]]) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 3.0, 8), mat(0x2e2a26));
  pole.position.set(lx, 1.5, lz); pole.castShadow = true; scene.add(pole);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), lampGlow);
  head.position.set(lx, 3.2, lz); scene.add(head);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.35, 4), mat(0x2e2a26));
  cap.position.set(lx, 3.6, lz); cap.rotation.y = Math.PI / 4; scene.add(cap);
  if (lz === 8 || lz === -8 || lz === -24) lampLightPos.push([lx, lz]);
}
for (const [lx, lz] of lampLightPos) {
  const pl = new THREE.PointLight(0xffb45e, 20, 18, 2);
  pl.position.set(lx, 3.1, lz); scene.add(pl);
}

/* 树 / 石头：避开房子街和广场 */
function tree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 8), mat(0x7a4a21));
  trunk.position.y = 1; trunk.castShadow = true; g.add(trunk);
  const c1 = new THREE.Mesh(new THREE.ConeGeometry(2.2, 4.5, 8), mat(0x2e7d32));
  c1.position.y = 4; c1.castShadow = true; g.add(c1);
  const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), mat(0x388e3c));
  c2.position.y = 6.2; c2.castShadow = true; g.add(c2);
  g.position.set(x, 0, z); scene.add(g);
}
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 30; i++) {
  const a = rnd() * Math.PI * 2, r = 38 + rnd() * 50;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (z > -38 && z < 22 && Math.abs(x) < 48) continue; // 房子街和广场留空
  if (Math.abs(x) < 24 && z > -95 && z < -62) continue; // 魔法城堡留空
  if (Math.hypot(x - 58, z - 15) < 24) continue; // 湖留空
  if (Math.abs(z + 60) < 8 && Math.abs(x) < 78) continue; // 高架桥留空
  tree(x, z);
  if (i % 4 === 0) {
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8 + rnd(), 0), mat(0x9aa0a6));
    rock.position.set(x + 4, 0.5, z + 3); scene.add(rock);
  }
}

/* ============ 魔法区：城堡 / 湖 / 群山 / 高架桥 / 列车（原创低模造型） ============ */
const EXTRA_BOXES = [];
const CIRCLES = [];

// ---- 湖（东边） ----
const LAKE = { x: 58, z: 15, r: 18 };
const rim = new THREE.Mesh(new THREE.CircleGeometry(LAKE.r + 1.5, 40), mat(0xd9c08a));
rim.rotation.x = -Math.PI / 2; rim.position.set(LAKE.x, 0.04, LAKE.z); scene.add(rim);
const water = new THREE.Mesh(new THREE.CircleGeometry(LAKE.r, 40),
  // 黄昏湖面：更深的暮蓝（旧 0x2b6cb0 正午亮蓝）
  new THREE.MeshLambertMaterial({ color: 0x4a6a9a, transparent: true, opacity: 0.92 }));
water.rotation.x = -Math.PI / 2; water.position.set(LAKE.x, 0.09, LAKE.z); scene.add(water);
CIRCLES.push(LAKE);

// ---- 湖边：小码头 / 小木船 / 芦苇 / 石头（景观，不改湖面碰撞，码头水上部分不可行走） ----
const lakeDock = new THREE.Group();
for (let i = 0; i < 10; i++) {
  const plank = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.18, 2.6), mat(i % 2 ? 0x8a6a42 : 0x7d5f38));
  plank.position.set(36.5 + i * 1.2, 0.38, 15); lakeDock.add(plank);
}
for (const px of [38, 42, 46]) for (const pz of [13.9, 16.1]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.6, 8), mat(0x5a3a1e));
  post.position.set(px, 0.15, pz); lakeDock.add(post);
}
for (const pz of [13.8, 16.2]) {
  const moor = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 1.1, 8), mat(0x5a3a1e));

function updateTrain(dt) {
  trainX += trainDir * 9 * dt;
  if (trainX > 62) { trainX = 62; trainDir = -1; train.rotation.y = Math.PI; }
  if (trainX < -62) { trainX = -62; trainDir = 1; train.rotation.y = 0; }
  train.position.x = trainX;
  puffTimer -= dt;
  if (puffTimer <= 0) {
    puffTimer = 0.14;
    const p = puffs[puffIdx]; puffIdx = (puffIdx + 1) % puffs.length;
    p.active = true; p.age = 0; p.mesh.visible = true;
    p.mesh.position.set(trainX + trainDir * 2.8, 9.6, VIA_Z);
  }
  for (const p of puffs) {
    if (!p.active) continue;
    p.age += dt;
    if (p.age > 2.2) { p.active = false; p.mesh.visible = false; continue; }
    p.mesh.position.y += 1.6 * dt;
    const s = 1 + p.age * 1.4; p.mesh.scale.set(s, s, s);
    p.mesh.material.opacity = 0.65 * (1 - p.age / 2.2);
  }
}

/* 手机：左摇杆移动，右半屏拖动看方向 */
let joyVec = { x: 0, y: 0 }, lookId = null, lastLook = null;
const joy = document.getElementById('joy'), knob = document.getElementById('joyKnob');
let joyId = null;
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); });
joy.addEventListener('pointermove', e => {
  if (e.pointerId !== joyId) return;
  const r = joy.getBoundingClientRect();
  let dx = (e.clientX - (r.left + r.width / 2)) / 50;
  let dy = (e.clientY - (r.top + r.height / 2)) / 50;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  joyVec = { x: dx, y: dy };
  knob.style.transform = 'translate(' + (dx * 30) + 'px,' + (dy * 30) + 'px)';
});
const joyEnd = e => {
  if (e.pointerId !== joyId) return;
  joyId = null; joyVec = { x: 0, y: 0 }; knob.style.transform = '';
};
joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);
canvas.addEventListener('pointerdown', e => {
  if (!isTouch) return;
  if (e.target !== canvas) return;
  lookId = e.pointerId; lastLook = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== lookId || !lastLook) return;
  yaw -= (e.clientX - lastLook.x) * 0.005;
  pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - lastLook.y) * 0.005));
  lastLook = { x: e.clientX, y: e.clientY };
});
const lookEnd = e => { if (e.pointerId === lookId) { lookId = null; lastLook = null; } };

function collide(p) {
  if (area !== 'outside') {
    const r = ROOMS[area];
    for (const b of r.boxes) {
      const dx = p.x - b.x, dz = p.z - b.z;
      if (Math.abs(dx) < b.hx + 0.6 && Math.abs(dz) < b.hz + 0.6) {
        const px = b.hx + 0.6 - Math.abs(dx), pz = b.hz + 0.6 - Math.abs(dz);
        if (px < pz) p.x = b.x + Math.sign(dx || 1) * (b.hx + 0.6);
        else p.z = b.z + Math.sign(dz || 1) * (b.hz + 0.6);
      }
    }
    p.x = Math.max(r.cx - r.hw, Math.min(r.cx + r.hw, p.x));
    p.z = Math.max(r.cz - r.hd, Math.min(r.cz + r.hd, p.z));
    return;
  }
  for (const h of HOUSES) {
    const dx = p.x - h.x, dz = p.z - h.z;
    if (Math.abs(dx) < h.hx + 0.6 && Math.abs(dz) < h.hz + 0.6) {
      const px = h.hx + 0.6 - Math.abs(dx), pz = h.hz + 0.6 - Math.abs(dz);
      if (px < pz) p.x = h.x + Math.sign(dx || 1) * (h.hx + 0.6);
      else p.z = h.z + Math.sign(dz || 1) * (h.hz + 0.6);
    }
  }
  for (const b of EXTRA_BOXES) {
    const dx = p.x - b.x, dz = p.z - b.z;
    if (Math.abs(dx) < b.hx + 0.6 && Math.abs(dz) < b.hz + 0.6) {
      const px = b.hx + 0.6 - Math.abs(dx), pz = b.hz + 0.6 - Math.abs(dz);
      if (px < pz) p.x = b.x + Math.sign(dx || 1) * (b.hx + 0.6);
      else p.z = b.z + Math.sign(dz || 1) * (b.hz + 0.6);
    }
  }
  for (const c of CIRCLES) {
    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz);
    if (d < c.r + 0.6) {
      if (d < 0.001) p.z = c.z + c.r + 0.6;
      else { p.x = c.x + dx / d * (c.r + 0.6); p.z = c.z + dz / d * (c.r + 0.6); }
    }
  }
  p.x = Math.max(-95, Math.min(95, p.x));
  p.z = Math.max(-95, Math.min(95, p.z));
}

const promptEl = document.getElementById('prompt');
const promptText = document.getElementById('promptText');
const btnEnterEl = document.getElementById('btnEnter');
const hidePrompt = () => promptEl.classList.remove('show');
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 16 : 9;
  let fx = 0, fz = 0;
  if (keys['KeyW'] || keys['ArrowUp']) fz -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) fz += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) fx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) fx += 1;
  fx += joyVec.x; fz += joyVec.y;
  const len = Math.hypot(fx, fz);
  if (len > 0) {
    fx /= Math.max(1, len); fz /= Math.max(1, len);
    const sin = Math.sin(yaw), cos = Math.cos(yaw);
    player.x += (-sin * -fz + cos * fx) * speed * dt;
    player.z += (-cos * -fz - sin * fx) * speed * dt;
  }
  collide(player);
  camera.position.copy(player);
  camera.rotation.y = yaw; camera.rotation.x = pitch;
  // 互动点（门、电视、卡片、琴凳、出口）
  if (teleportGrace > 0) teleportGrace -= dt;
  currentAct = null;
  if (teleportGrace <= 0) {
    let best = 1e9;
    for (const it of interactables()) {
      const d = Math.hypot(player.x - it.x, player.z - it.z);
      if (d < it.r && d < best) { best = d; currentAct = it; }
    }
  }
  if (currentAct) {
    promptText.textContent = lang === 'zh' ? currentAct.zh : currentAct.en;
    btnEnterEl.textContent = lang === 'zh' ? currentAct.btnZh : currentAct.btnEn;
    promptEl.classList.add('show');
  } else promptEl.classList.remove('show');
  updateTrain(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

/* ============ 界面文案 / 菜单 / 语言 ============ */
let started = false;
function showStart(resume) {
  const ov = document.getElementById('startOverlay');
  ov.classList.remove('hidden');
  document.getElementById('btnStart').textContent = resume ? (lang === 'zh' ? '继续漫步' : 'Continue') : T[lang].startBtn;
}
function applyLang() {
  const t = T[lang];
  document.getElementById('subtitle').textContent = t.subtitle;
  document.getElementById('menuLabel').textContent = t.menu;
  document.getElementById('btnLang').textContent = lang === 'zh' ? 'EN' : '中文';
  document.getElementById('hint').textContent = isTouch
    ? (lang === 'zh' ? '左摇杆移动 · 右半屏拖动看方向 · 靠近房子点进入' : 'Left stick to move · drag right side to look · tap Enter near a house')
    : t.hint;
  document.getElementById('startText').innerHTML = t.start;
  if (!started) document.getElementById('btnStart').textContent = t.startBtn;
  document.getElementById('startMenuLink').textContent = t.startMenu;
  document.getElementById('menuTitle').textContent = t.menuTitle;
  document.getElementById('menuClose').textContent = t.close;
  document.getElementById('selectTitle').textContent = t.selectTitle;
  document.getElementById('selectClose').textContent = t.close;
  const list = document.getElementById('menuList');
  list.innerHTML = '';
  for (const a of APPS) {
    const el = document.createElement('a');
    el.className = 'mcard'; el.href = a.url;
    el.innerHTML = '<b>' + (lang === 'zh' ? a.zh : a.en) + '</b><span>' + (lang === 'zh' ? a.zhDesc : a.enDesc) + '</span>';
    list.appendChild(el);
  }
  const cl = document.createElement('a');
  cl.className = 'mcard'; cl.href = 'classic.html';
  cl.innerHTML = '<b>' + t.classic + '</b>';
  list.appendChild(cl);
  for (const s of signMats) {
    s.mat.map = s.castle ? makeCastleSign() : s.tv ? makeTVTexture() : makeSignTexture(s.app);
    s.mat.needsUpdate = true;
  }
}
document.getElementById('btnLang').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('axismotion-lang', lang);
  applyLang();
});
document.getElementById('btnStart').addEventListener('click', () => {
  started = true;
  document.getElementById('startOverlay').classList.add('hidden');
  if (!isTouch) canvas.requestPointerLock();
});
document.getElementById('btnMenu').addEventListener('click', () => {
  document.getElementById('menu').classList.add('show');
  if (document.pointerLockElement) document.exitPointerLock();
});
document.getElementById('startMenuLink').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('menu').classList.add('show');
});
document.getElementById('menuClose').addEventListener('click', () => {
  document.getElementById('menu').classList.remove('show');
  if (started && !isTouch) canvas.requestPointerLock();
});
const GAME_IDX = [0, 2, 4, 5];
function openGamePanel() {
  const list = document.getElementById('selectList');
  list.innerHTML = '';
  for (const i of GAME_IDX) {
    const a = APPS[i];
    const el = document.createElement('a');
    el.className = 'mcard'; el.href = a.url;
    el.innerHTML = '<b>' + (lang === 'zh' ? a.zh : a.en) + '</b><span>' + (lang === 'zh' ? a.zhDesc : a.enDesc) + '</span>';
    list.appendChild(el);
  }
  document.getElementById('selectPanel').classList.add('show');
  if (document.pointerLockElement) document.exitPointerLock();
}
document.getElementById('selectClose').addEventListener('click', () => {
  document.getElementById('selectPanel').classList.remove('show');
  if (started && !isTouch) canvas.requestPointerLock();
});
document.getElementById('btnEnter').addEventListener('click', () => {
  if (currentAct) currentAct.run();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
applyLang();
</script>
